services:
  mongodb:
    image: mongo:7
    container_name: blogging-platform
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
        URL_MONGO_DB: "mongodb://localhost:27017/blog_py"
  redis:
    image: redis:7
    container_name: blogging-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  mongodb_data:
  redis_data: